name: Validar GeoPaleo
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  catalogo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar registros y coordenadas públicas
        run: python scripts/validar_catalogo.py
      - name: Ejecutar pruebas de regresión
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Comprobar sintaxis JavaScript
        run: |
          node --check js/app.js
          node --check js/catalogo.js
          node --check js/distribucion.js
  navegador:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar Chromium para Playwright
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Probar escritorio y móvil
        run: |
          python -m http.server 8765 --bind 127.0.0.1 > /tmp/geopaleo-http.log 2>&1 &
          node tests/smoke-browser.cjs
