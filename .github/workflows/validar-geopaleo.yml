name: Validar GeoPaleo
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  catalogo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar registros y coordenadas públicas
        run: python scripts/validar_catalogo.py
      - name: Ejecutar pruebas de regresión
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Comprobar sintaxis JavaScript
        run: |
          node --check js/app.js
          node --check js/catalogo.js
          node --check js/distribucion.js
  navegador:
    runs-on: ubuntu-latest
    # Chromium y dependencias preinstalados sobre Ubuntu 24.04 (Noble).
    # Evita depender de la versión del SO del runner (p. ej. Ubuntu 26.04).
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Instalar la biblioteca Playwright de la misma versión
        run: npm install --no-save playwright@1.56.1
      - name: Comprobar versión de Node y navegador
        run: |
          node --version
          node -e "const {chromium}=require('playwright'); console.log('Chromium:', chromium.executablePath())"
      - name: Probar escritorio y móvil
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/geopaleo-http.log 2>&1 &
          node tests/smoke-browser.cjs
